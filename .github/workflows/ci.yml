name: CI

# The build gate (tp-03, D-094): every push to any branch and every pull request runs the same
# `npm run build` a deploy runs, which includes `npm run tenant:validate` (tenant.json checked
# against the checkout). No deploy here: GitHub Pages is pages.yml on main.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

    <title>Aluzina Business OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Rubik is the free fallback for DIN Round Pro (rounded DIN grotesque); the licensed face loads from /fonts/ via src/styles/fonts.css when present. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap"
    />
    <script>
      // First-paint preferences (mirrors the providers; keys documented in docs/reference/surfaces.md).
      (function () {
        try {
          var theme = localStorage.getItem('aluzina.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var lang = localStorage.getItem('aluzina.lang');
          if (lang === 'es' || lang === 'en') document.documentElement.lang = lang;
          if (localStorage.getItem('aluzina.devMode') === 'on') document.documentElement.setAttribute('data-dev', 'on');
        } catch (e) {}
      })();
    </script>
